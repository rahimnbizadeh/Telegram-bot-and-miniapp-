async function renderPaymentStep(){
  const plan = buyFlow.plan;
  const isRenew = !!buyFlow.renewSubId;
  const price = currentPrice();
  // وقتی کد تخفیف تازه اعمال شده، قیمت از مبلغ قبلی تا مبلغ جدید می‌شمره (فقط اولین بار برای هر کد)
  const animFrom = (buyFlow.discountPercent && buyFlow._pa !== buyFlow.discountCode) ? plan.price : null;
  const discRow = buyFlow.discountCode
    ? `<div class="r ok"><span>کد «${esc(buyFlow.discountCode)}» · ${fa(buyFlow.discountPercent)}٪ تخفیف</span><b>−${money(plan.price - price)} تومان</b></div>`
    : '';
  const headHTML = `<div class="h2-sum-head"><div><small>${isRenew ? 'تمدید سرویس' : 'خرید سرویس جدید'}</small><b>${esc(fa(plan.title))}${buyFlow.customName ? ` <bdi dir="ltr" class="nm">${esc(buyFlow.customName)}</bdi>` : ''}</b></div>${isRenew ? `<button type="button" class="h2-chg" onclick="startRenew(${buyFlow.renewSubId})">تغییر پلن</button>` : ''}</div>`;

  /* صفحه‌ی پشت کشو: خلاصه‌ی سفارش + دکمه‌ی بازکردن کشو (data-main نداره تا دکمه‌ی خود تلگرام روی کشو نیفته) */
  document.getElementById('subContent').innerHTML = `
    <div class="h2-sum">${headHTML}</div>
    <button class="btn" type="button" onclick="openPaySheet()">انتخاب روش پرداخت</button>`;

  document.getElementById('pSheet').innerHTML = `
    <div class="ps-head">${csHead('پرداخت')}<div class="ps-sub">سفارشت رو بررسی کن و روش پرداخت رو انتخاب کن.</div></div>
    <div class="ps-body">
      <div class="h2-sum">
        ${headHTML}
        <div class="h2-sum-rows">
          <div class="r"><span>قیمت پلن</span><b>${money(plan.price)} تومان</b></div>
          ${discRow}
          <div class="r" id="pmFeeRow" hidden><span>کارمزد درگاه</span><b id="pmFee"></b></div>
        </div>
        <div class="h2-sum-total"><span>مبلغ قابل پرداخت</span><b id="payPrice">${money(animFrom !== null ? animFrom : price)} تومان</b></div>
      </div>
      ${isRenew ? '<div class="ps-note">با تمدید، مدت سرویس از امروز دوباره شروع میشه و حجم باقی‌مانده‌ی فعلی به حجم این پلن اضافه میشه.</div>' : ''}
      ${(!isRenew && !buyFlow.discountCode) ? `
        <button class="h2-lnk h2-promo" type="button" onclick="this.hidden=true;document.getElementById('discBox').hidden=false;document.getElementById('discountInput').focus()">کد تخفیف داری؟</button>
        <div id="discBox" hidden><div class="linkbox"><input id="discountInput" placeholder="کد تخفیف" dir="ltr" autocomplete="off" autocapitalize="characters"><button type="button" onclick="applyDiscount()">اعمال</button></div></div>
      ` : ''}
      <div class="sec" style="margin-top:18px"><h2>روش پرداخت</h2></div>
      <div id="payMethods">${SKEL(1)}</div>
    </div>
    <div class="ps-foot"><button class="btn" type="button" id="pmGo" disabled onclick="pmGoNow()">روش پرداخت رو انتخاب کن</button></div>`;
  openPaySheet();

  if (animFrom !== null){
    buyFlow._pa = buyFlow.discountCode;
    const pe = document.getElementById('payPrice');
    if (pe){ pe.dataset.rawVal = animFrom; animateNumber(pe, price, n => money(n) + ' تومان'); }
  }
  let payInfo = {autosms_enabled:false, manual_card_enabled:true, crypto_enabled:false, tonpays_enabled:false, winapay_enabled:false};
  try{ payInfo = await fetch(`${API_BASE}/api/payment-info`).then(r => r.json()); } catch(e){}
  let wallet = null;
  try{ wallet = await apiGet('/api/wallet'); } catch(e){}
  pmMount(payInfo, isRenew ? 'renew' : 'new', price, wallet);
}

async function applyDiscount(){
  const code = document.getElementById('discountInput').value.trim().toUpperCase();
  if (!code) return;
  try{
    const res = await apiGet(`/api/discount/check?code=${encodeURIComponent(code)}&plan_id=${buyFlow.planId}`);
    if (!res.ok){
      const errMap = {not_found:'کد پیدا نشد', inactive:'کد غیرفعاله', expired:'کد منقضی شده', max_uses:'ظرفیت کد تموم شده', already_used:'قبلاً ازش استفاده کردی'};
      showToast(errMap[res.error] || 'کد معتبر نیست', true);
      return;
    }
    buyFlow.discountCode = res.code;
    buyFlow.discountPercent = res.percent;
    showToast('کد تخفیف اعمال شد');
    renderPaymentStep();
  } catch(e){ showToast('مشکلی پیش اومد', true); }
}

/* --- پرداخت از کیف پول --- */
async function payWithWallet(){
  if (buyFlow.renewSubId){ renewWithWallet(); return; }
  showToast('در حال صدور سرویس...');
  try{
    const data = await apiPost('/api/buy', {
      plan_id: buyFlow.planId, custom_name: buyFlow.customName, discount_code: buyFlow.discountCode,
    });
    if (data.balance !== undefined) setTopBalance(data.balance);
    showBuySuccess(data);
  } catch(e){
    if (e.data && e.data.error === 'insufficient_balance') showToast('موجودی کافی نیست', true);
    else if (e.data && e.data.error === 'join_required'){
      showToast('اول عضو کانال ما شو، بعد دوباره امتحان کن', true);
      if (e.data.link) openExternal(e.data.link);
    }
    else if (e.data && e.data.error === 'discount_invalid') showToast('کد تخفیف دیگه معتبر نیست', true);
    else showToast('مشکلی پیش اومد', true);
  }
}

function showBuySuccess(data){
  loadedTabs.delete('services');
  document.getElementById('subTitle').textContent = 'خرید انجام شد';
  setSteps(STEPS_NEW, 99);
  document.getElementById('subContent').innerHTML = receiptHTML({
    title: 'خرید انجام شد', stamp: 'فعال شد',
    rows: [['پلن', fa(data.plan_title)]], link: data.sub_link,
  }) + `<div class="after-rcpt"><button class="btn" type="button" onclick="goto('services')">دیدن سرویس‌هام</button></div>`;
  document.getElementById('screen-sub').scrollTop = 0;
  showToast('خرید با موفقیت انجام شد', false, 'quiet'); landStamp();

async function payWithCard(){
  document.getElementById('subContent').innerHTML = cardScreenHTML(currentPrice(), {num:'cardNumberBox', copy:'copyCardBtn', holder:'cardHolderBox', file:'receiptFile', btn:'uploadReceiptBtn'});
  wireReceiptPicker('receiptFile', 'uploadReceiptBtn');
  try{
    const info = await fetch(`${API_BASE}/api/payment-info`).then(r => r.json());
    document.getElementById('cardNumberBox').value = info.card_number;
    document.getElementById('cardHolderBox').textContent = 'به نام: ' + info.card_holder;
    const copyBtn = document.getElementById('copyCardBtn');
    copyBtn.style.display = 'block';
    copyBtn.onclick = () => copyText(info.card_number);
  } catch(e){
    document.getElementById('cardNumberBox').value = L('خطا در دریافت شماره کارت؛ دوباره امتحان کن');
  }
  document.getElementById('uploadReceiptBtn').onclick = async () => {
    const fileInput = document.getElementById('receiptFile');
    if (!fileInput.files.length){ showToast('اول عکس رسید رو انتخاب کن', true); return; }
    const btn = document.getElementById('uploadReceiptBtn');
    btn.disabled = true; btn.textContent = 'در حال ارسال...';
    const form = new FormData();
    form.append('init_data', initData);
    form.append('plan_id', buyFlow.planId);
    if (buyFlow.renewSubId){
      form.append('kind', 'renew');
      form.append('sub_id', buyFlow.renewSubId);
    } else {
      if (buyFlow.customName) form.append('custom_name', buyFlow.customName);
      if (buyFlow.discountCode) form.append('discount_code', buyFlow.discountCode);
    }
    form.append('photo', fileInput.files[0]);
    try{
      const res = await fetch(`${API_BASE}/api/receipt-upload`, {method:'POST', body: form});
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'failed');
      document.getElementById('subContent').innerHTML = emptyState(
        buyFlow.renewSubId
          ? 'رسید ارسال شد؛ به محض تایید ادمین، سرویست تمدید میشه و بهت خبر می‌دیم.'
          : 'رسید ارسال شد؛ به محض تایید ادمین، سرویس فعال میشه و بهت خبر می‌دیم.', 'ok') + renewBackHTML();
      showToast('رسید با موفقیت ارسال شد');
    } catch(e){
      btn.disabled = false; btn.textContent = 'ارسال رسید';
      showToast('ارسال رسید ناموفق بود', true);
    }
  };
}

async function checkWinaPayStatus(manual){
  if (!winapayAuthority) return;
  const btn = manual ? document.getElementById('checkWinaBtn') : null;
  if (btn) setBusy(btn, true);
  try{
    const res = await apiGet(`/api/winapay/status?authority=${encodeURIComponent(winapayAuthority)}`);
    if (res.status === 'paid'){
      stopWinapayPoll();
      showToast('پرداخت تایید شد!');
      HAP.ok();
      loadedTabs.delete('services');
      const msg = winapayIsTopup ? 'پرداختت تایید شد و کیف پولت شارژ شد.' : 'پرداختت تایید شد. جزئیات سرویس رو داخل چت بات برات فرستادیم.';
      document.getElementById('subContent').innerHTML = emptyState(msg, 'ok') + renewBackHTML();
    } else if (res.status === 'expired'){
      stopWinapayPoll();
      showToast('این فاکتور منقضی شده؛ دوباره از اول امتحان کن', true);
    } else if (manual){
      showToast('هنوز پرداختی تایید نشده؛ چند لحظه دیگه دوباره امتحان کن', true);
    }
  } catch(e){
    if (manual) showToast('مشکلی پیش اومد', true);
  } finally {
    if (btn) setBusy(btn, false);
  }
}

/* سکه‌ی پاداش: اگه بعد از آخرین ورودت پاداش ماهانه‌ی باشگاه به کیف پول اضافه شده، یه سکه تو چیپ می‌افته */
function playCoin(amount){
  const chip = document.querySelector('.credit');
  if (!chip) return;
  const amt = '\u2066+' + money(amount) + '\u2069';   // «+» کنار عدد بمونه، نه آخر جمله
  chip.insertAdjacentHTML('beforeend', `<span class="coin" aria-hidden="true">$</span><span class="plus" aria-hidden="true">${amt}</span>`);
  setTimeout(() => HAP.thud(), 800);
  setTimeout(() => { chip.classList.add('got'); HAP.ok(); }, 850);
  setTimeout(() => {
    chip.classList.remove('got');
    chip.querySelectorAll('.coin, .plus').forEach(x => x.remove());
  }, 2400);
  showToast(L('پاداش ماهانه‌ی باشگاه مشتریان: {0} تومان به کیف پولت اضافه شد', amt), false, 'quiet');
}
function checkBonusCoin(b){
  if (!b) return;
  let seen = null;
  try{ seen = localStorage.getItem('bonusSeen'); }catch(e){}
  try{ localStorage.setItem('bonusSeen', String(b.at)); }catch(e){}
  if (seen === null) return;            // اولین بار: فقط ثبت میشه
  if (b.at > Number(seen)) playCoin(b.amount);
}

/* سرویسی که تمدید خودکارش روشنه ولی موجودی کیف پول به قیمت پلنش نمی‌رسه */
function walletRisk(balance){
  if (servicesState !== 'ok') return null;
  return allServices
    .filter(s => s.auto_renew && s.renew_price && balance < s.renew_price)
    .sort((a, b) => (a.remaining_days === null ? 1e9 : a.remaining_days) - (b.remaining_days === null ? 1e9 : b.remaining_days))[0] || null;
}

document.getElementById('subContent').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && svcDetail) svcAct(b.dataset.act, b);
});

async function svcAct(act, btn){
  const d = svcDetail;
  switch(act){
    case 'renew': startRenew(d.sub_id); break;
    case 'connect': openConnectSheet(d.subscription_url, connName(d.username), d.sub_id); break;
    case 'qr': openShareSheet(d); break;
    case 'status': openExternal(d.subscription_url); break;
    case 'online': await checkOnline(btn); break;
    case 'autorenew': await toggleAutoRenew(btn); break;
    case 'note': { const box = document.getElementById('noteBox'); box.hidden = !box.hidden; if (!box.hidden) document.getElementById('noteInput').focus(); break; }
    case 'note-save': await saveNote(btn); break;
    case 'refresh': await refreshLink(); break;
    case 'transfer': await transferService(); break;
    case 'delete': await deleteService(); break;
  }
}


/* چیپ «آنلاین/آفلاین» کنار اسم سرویس تو بلیط جزئیات */
function setLiveChip(online){
  const name = document.querySelector('#subContent .h2-card .h2-top > span:first-child');
  if (!name) return;
  const old = name.querySelector('.live'); if (old) old.remove();
  name.insertAdjacentHTML('beforeend', online
    ? '<span class="live on"><i class="lv-dot"></i>آنلاین</span>'
    : '<span class="live off"><i class="lv-dot"></i>آفلاین</span>');
}
/* با باز شدن جزئیات، خودکار وضعیت اتصال رو می‌پرسیم (یه درخواست) */
async function autoCheckOnline(subId){
  try{
    const r = await apiGet(`/api/service/${subId}/online`);
    if (svcDetail && svcDetail.sub_id === subId) setLiveChip(!!r.online);
  } catch(e){}
}

async function checkOnline(btn){
  const res = document.getElementById('onlineRes');
  btn.disabled = true;
  res.innerHTML = '';
  try{
    const r = await apiGet(`/api/service/${svcDetail.sub_id}/online`);
    setLiveChip(!!r.online);
    res.innerHTML = r.online
      ? '<span class="pill on">همین الان به سرور وصله</span>'
      : '<span class="pill off">همین الان هیچ اتصال فعالی دیده نمیشه</span>';
  } catch(e){
    showToast('بررسی وضعیت اتصال ناموفق بود؛ دوباره امتحان کن', true);
  }
  btn.disabled = false;
}

async function toggleAutoRenew(btn){
  const d = svcDetail;
  const want = !d.auto_renew;
  btn.disabled = true;
  try{
    await apiPost(`/api/service/${d.sub_id}/autorenew`, {enabled: want});
    d.auto_renew = want;
    btn.classList.toggle('on', want);
    btn.setAttribute('aria-checked', String(want));
    showToast(want ? 'تمدید خودکار روشن شد؛ لحظه‌ی انقضا مبلغ پلن از کیف پولت کسر میشه.' : 'تمدید خودکار خاموش شد.');
  } catch(e){
    showToast('تغییر تمدید خودکار ناموفق بود', true);
  }
  btn.disabled = false;
}

async function saveNote(btn){
  const d = svcDetail;
  const val = document.getElementById('noteInput').value;
  btn.disabled = true;
  try{
    const r = await apiPost(`/api/service/${d.sub_id}/note`, {note: val});
    d.note = r.note;
    document.getElementById('noteHint').textContent = d.note || 'هنوز یادداشتی ثبت نشده';
    document.getElementById('noteBox').hidden = true;
    showToast('یادداشت ذخیره شد');
  } catch(e){
    showToast('ذخیره‌ی یادداشت ناموفق بود', true);
  }
  btn.disabled = false;
}

/* ---------------- تمدید سرویس (همون مسیر بات: پلن → روش پرداخت) ---------------- */
let renewCtx = null;
let renewMonths = null;   // مدتِ انتخاب‌شده‌ی تمدید (تب فعال)؛ پیش‌فرض: مدتِ پلن پیشنهادی یا اولین مدت
async function startRenew(subId){
  const d = svcDetail;
  openSub('تمدید سرویس', () => openServiceDetail(subId));
  try{
    if (!shopPlansCache){ const r = await apiGet('/api/shop'); shopPlansCache = r.plans; }
  } catch(e){
    document.getElementById('subContent').innerHTML = emptyState('مشکلی توی بارگذاری پلن‌ها پیش اومد.', 'error', `startRenew(${subId})`);
    return;
  }
  if (!shopPlansCache.length){
    document.getElementById('subContent').innerHTML = emptyState('فعلاً پلنی تعریف نشده.');
    return;
  }
  const name = d ? (d.username || d.plan_title) : '';
  const rec = d && d.recommendation && shopPlansCache.some(p => p.id === d.recommendation.plan_id) ? d.recommendation : null;
  renewCtx = {subId, name, rec};
  renderRenewDurations();
}

/* مرحله‌ی ۱ تمدید: انتخاب مدت (مثل بات: لوکیشن ← مدت ← حجم ← پرداخت) */
function renderRenewDurations(){
  const c = renewCtx;
  if (!c) return;
  subBackFn = () => openServiceDetail(c.subId);
  setSteps(STEPS_RENEW, 1);
  const recPlan = c.rec ? shopPlansCache.find(p => p.id === c.rec.plan_id) : null;
  const months = DUR_ORDER.filter(mo => durStats(shopPlansCache, mo));
  if (!renewMonths || months.indexOf(renewMonths) < 0) renewMonths = recPlan ? recPlan.duration_months : months[0];
  document.getElementById('subContent').innerHTML = `
    <div class="fare"><span>سرویس</span><b class="sm">${esc(c.name)}</b></div>
    <details class="h2-intro"><summary>نحوه‌ی تمدید</summary><p class="note">پلن تمدید رو انتخاب کن. مدت سرویس از امروز دوباره از اول شروع میشه و مصرف قبلی صفر میشه. حجم باقی‌مانده‌ی فعلی هم دور ریخته نمیشه و به حجم پلن جدید اضافه میشه (مثلاً ۵ گیگ باقی‌مانده + پلن ۱۰ گیگ = ۱۵ گیگ).</p></details>
    ${recNoteHTML(c.rec)}
    <div class="tabs wrap" id="renewTabs">${months.map(mo => `<button type="button" class="tab" data-m="${mo}" onclick="renewPickDur(${mo})">${fa(mo)} ماهه${recPlan && recPlan.duration_months === mo ? ' · پیشنهادی' : ''}</button>`).join('')}</div>
    <div id="renewCatalog"></div>`;
  renderRenewCatalog();
  document.getElementById('screen-sub').scrollTop = 0;
}

/* تب مدت بالا، پلن‌های همون مدت زیرش (مثل فروشگاه و نمایندگی) */
function renderRenewCatalog(){
  const c = renewCtx;
  if (!c) return;
  const st = durStats(shopPlansCache, renewMonths);
  document.querySelectorAll('#renewTabs .tab').forEach(t => t.classList.toggle('active', +t.dataset.m === renewMonths));
  const list = shopPlansCache.filter(p => p.duration_months === renewMonths);
  const per = list.map(p => p.gb ? Math.round(p.price / p.gb) : 0);
  const same = per.length > 1 && new Set(per).size === 1;
  document.getElementById('renewCatalog').innerHTML = (st
      ? `<p class="note">${same ? L('{0} روز اعتبار، حجم از {1} تا {2} گیگ · هر گیگ {3} تومان', fa(st.days), fa(st.minGb), fa(st.maxGb), money(per[0])) : L('{0} روز اعتبار، حجم از {1} تا {2} گیگ', fa(st.days), fa(st.minGb), fa(st.maxGb))}</p>` : '')
    + planTicketsHTML(list, 'pickRenewPlan', 'تمدید', c.rec ? c.rec.plan_id : null);
}
function renewPickDur(m){
  if (!renewCtx || !durStats(shopPlansCache, m)) return;
  renewMonths = m;
  renderRenewCatalog();
}

function recNoteHTML(rec){
  if (!rec) return '';
  const avg = dec(fa(String(+Number(rec.avg_gb).toFixed(2))));
  const msg = rec.sufficient
    ? L('با مصرف روزی حدود {0} گیگ، حجم پلن پیشنهادی برای کل دوره‌ش کافیه.', avg)
    : L('مصرفت (روزی حدود {0} گیگ) بالاست و پلن پیشنهادی بزرگ‌ترین پلن محدوده؛ اگه باز هم کم اومد با پشتیبانی صحبت کن.', avg);
  return `<div class="rec-note">${msg}</div>`;
}

function pickRenewPlan(planId){
  const plan = shopPlansCache.find(p => p.id === planId);
  if (!plan || !svcDetail) return;
  buyFlow = {planId, plan, renewSubId: svcDetail.sub_id, customName: null, discountCode: null, discountPercent: null};
  showPaymentStep();
}

async function renewWithWallet(){
  const id = buyFlow.renewSubId;
  showToast('در حال تمدید سرویس...');
  try{
    const data = await apiPost(`/api/service/${id}/renew`, {plan_id: buyFlow.planId});
    setTopBalance(data.balance);
    loadedTabs.delete('services');

const TICKET_STATUS = {
  open:     {label: 'باز',           cls: 'warn'},
  answered: {label: 'پاسخ داده‌شده', cls: 'good'},
  closed:   {label: 'بسته',          cls: 'mute'},
};
/* ساعت ایران: UTC+3:30 و بدون ساعت تابستانی */
function tktTime(ts){
  if (!ts) return '';
  if (LANG !== 'fa'){   // فارسی: ساعت ایران؛ بقیه: ساعت خود گوشی
    const d = new Date(ts * 1000), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  const t = ts + 12600, d = new Date(t * 1000);
  return `${jalaliFromTimestamp(t)} ${fa(String(d.getUTCHours()).padStart(2, '0'))}:${fa(String(d.getUTCMinutes()).padStart(2, '0'))}`;
}
const TICKET_MAX = 2000;

async function openTicket(id){
  openSub(`تیکت #${fa(id)}`, openSupportSub);

}

async function loadTicket(id){
  let d;
  try{
    d = await apiGet(`/api/tickets/${id}`);
  } catch(e){
    document.getElementById('subContent').innerHTML = emptyState('نتونستم این تیکت رو بیارم.', 'error', `loadTicket(${id})`);
    return;
  }
  const st = TICKET_STATUS[d.status] || TICKET_STATUS.closed;
  const msgs = d.messages.map(m =>
    `<div class="msg ${m.sender === 'user' ? 'user' : 'admin'}"><span class="who">${m.sender === 'user' ? 'تو' : 'پشتیبانی'}</span><div class="txt">${esc(m.text)}</div><small>${tktTime(m.created_at)}</small></div>`
  ).join('');
  const isOpen = d.status !== 'closed';
  document.getElementById('subContent').innerHTML = `
    <div class="tk-bar"><span class="stamp ${st.cls}">${st.label}</span><span class="upd">آخرین بروزرسانی: ${tktTime(d.updated_at)}</span>
      <button type="button" class="linkback" id="ticketRefresh">${icon('refresh')}بروزرسانی</button></div>
    <div class="msgs">${msgs}</div>
    ${isOpen ? `
      <textarea class="field" id="ticketReply" rows="3" maxlength="${TICKET_MAX}" placeholder="پیام جدیدت رو بنویس..."></textarea>
      <button class="btn" type="button" id="ticketSendBtn">${icon('chat')}ارسال پیام</button>`
    : `<div class="sd-alert info">این تیکت بسته شده. اگه هنوز مشکل داری، یه تیکت جدید ثبت کن.</div>
       <button class="btn" type="button" onclick="openNewTicket()">ثبت تیکت جدید</button>`}`;
  document.getElementById('ticketRefresh').onclick = () => loadTicket(id);
  if (isOpen){
    document.getElementById('ticketSendBtn').onclick = async () => {
      const text = document.getElementById('ticketReply').value.trim();
      if (!text){ showToast('اول پیامت رو بنویس', true); return; }
      const btn = document.getElementById('ticketSendBtn');
      btn.disabled = true;
      try{
        await apiPost(`/api/tickets/${id}/reply`, {text});
        showToast('پیامت ارسال شد');
        await loadTicket(id);
      } catch(e){
        btn.disabled = false;
        const code = e.data && e.data.error;
        if (code === 'closed'){ showToast('این تیکت بسته شده.', true); loadTicket(id); }
        else showToast(code === 'too_long' ? `پیام خیلی بلنده (حداکثر ${fa(TICKET_MAX)} کاراکتر)` : 'ارسال پیام ناموفق بود؛ دوباره امتحان کن', true);
      }
    };
  }
  const sc = document.getElementById('screen-sub');
  sc.scrollTop = sc.scrollHeight;
}

const toEn = s => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,،٬\s]/g, '');

function openWalletTransfer(){
  openSub('انتقال موجودی', openWalletSub);
  document.getElementById('subContent').innerHTML = `
    <p class="note">آیدی عددی کاربری که می‌خوای بهش موجودی منتقل کنی رو بنویس. (اون کاربر باید قبلاً حداقل یک بار به بات /start زده باشه.)</p>
    <input class="field ltr" id="xferTarget" type="text" inputmode="numeric" placeholder="آیدی عددی تلگرام" dir="ltr" autocomplete="off">

  const inp = document.getElementById('xferTarget'), err = document.getElementById('xferErr'), btn = document.getElementById('xferNext');
  btn.onclick = async () => {
    const raw = toEn(inp.value);
    err.textContent = '';
    if (!/^\d+$/.test(raw)){ err.textContent = 'لطفاً فقط آیدی عددی معتبر بنویس.'; return; }
    btn.disabled = true;
    try{
      const r = await apiPost('/api/wallet/transfer/check', {target_id: raw});

    } catch(e){

      const code = e.data && e.data.error;
      err.textContent = code === 'self_transfer' ? 'نمی‌تونی به خودت انتقال بدی.'
        : code === 'target_not_found' ? 'این آیدی هنوز به بات پیام نداده. اول باید اون کاربر /start رو بزنه، بعد دوباره امتحان کن.'
        : code === 'invalid_id' ? 'لطفاً فقط آیدی عددی معتبر بنویس.'
        : 'بررسی آیدی ناموفق بود؛ دوباره امتحان کن.';
    }
  };

function walletTransferAmountStep(targetId, balance){
  openSub('انتقال موجودی', openWalletTransfer);
  document.getElementById('subContent').innerHTML = `
    <div class="fare"><span>موجودی فعلی تو</span><b>${money(balance)} تومان</b></div>
    <p class="note">${L('چقدر می‌خوای به {0} منتقل کنی؟ (فقط عدد، به تومان)', `<b class="ltr-inline">${esc(targetId)}</b>`)}</p>
    <input class="field ltr" id="xferAmount" type="text" inputmode="numeric" placeholder="مثلاً 50000" dir="ltr" autocomplete="off">
    <div class="form-err" id="xferErr" role="alert"></div>
    <button class="btn" type="button" id="xferGo">ادامه</button>`;
  const inp = document.getElementById('xferAmount'), err = document.getElementById('xferErr'), btn = document.getElementById('xferGo');
  btn.onclick = async () => {
    const raw = toEn(inp.value);
    err.textContent = '';
    if (!/^\d+$/.test(raw) || Number(raw) <= 0){ err.textContent = 'لطفاً فقط عدد معتبر بنویس.'; return; }
    const amount = Number(raw);
    if (amount > balance){ err.textContent = `موجودی کافی نیست. موجودی فعلی: ${money(balance)} تومان. یه مبلغ کمتر بنویس.`; return; }
    if (!(await uiConfirm(`مطمئنی می‌خوای ${money(amount)} تومان به آیدی ${targetId} منتقل کنی؟`, 'بله، منتقل کن', undefined, true))) return;
    btn.disabled = true;
    try{
      const r = await apiPost('/api/wallet/transfer', {target_id: targetId, amount});
      setTopBalance(r.balance);
      document.getElementById('subTitle').textContent = 'انتقال انجام شد';
      document.getElementById('subContent').innerHTML = `
        ${emptyState(`مبلغ ${money(r.amount)} تومان به آیدی ${esc(targetId)} منتقل شد.`, 'ok')}
        <div class="fare"><span>موجودی جدید تو</span><b>${money(r.balance)} تومان</b></div>
        <button class="btn" type="button" onclick="openWalletSub()">بازگشت به کیف پول</button>`;
      showToast('انتقال با موفقیت انجام شد');
    } catch(e){
      btn.disabled = false;
      const code = e.data && e.data.error;
      err.textContent = code === 'insufficient_balance' ? 'موجودی کافی نیست یا خطایی پیش اومد.' : 'انتقال ناموفق بود؛ دوباره امتحان کن.';
      if (code === 'insufficient_balance' && e.data.balance !== undefined) setTopBalance(e.data.balance);
    }
  };
}

const TIER_COL = ['#D08A4E', '#B9C4D0', '#F2B705', '#5CD6E8'];   // روی زمینه‌ی تیره
const TIER_INK = ['#A75B22', '#5F6F80', '#B98500', '#1E7C98'];   // روی کاغذ

function medalSVG(i, size, col){
  col = col || (curTheme() === 'light' ? TIER_INK[i] : TIER_COL[i]) || '#8A94A8';
  const body = i === 3
    ? `<path d="M7 4h10l4.500 5.200L12 20.500 2.500 9.200z" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="1.700" stroke-linejoin="round"/><path d="M2.500 9.200h19M9.500 4 8 9.200l4 11.300 4-11.300L14.500 4" fill="none" stroke="${col}" stroke-width="1.400" stroke-linejoin="round"/>`
    : `<path d="M8 2.500 12 9.500l4-7" fill="none" stroke="${col}" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="15" r="6.300" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="1.800"/><path d="m12 11.700 1 2 2.200.300-1.600 1.500.400 2.200-2-1.100-2 1.100.4-2.200-1.600-1.500 2.200-.3z" fill="${col}"/>`;
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">${body}</svg>`;
}

function renderBanners(){
  const slot = document.getElementById('bannerSlot');
  if (!slot) return;
  clearInterval(bannerTimer);
  if (!banners.length){ slot.innerHTML = ''; return; }
  slot.innerHTML = `
    <div class="bn">
      <div class="bn-track" id="bnTrack">${banners.map((b, i) => {
        const v = (b[LANG] && b[LANG].title) ? b[LANG] : b.fa;
        const cta = b.action ? `<span class="bn-cta">${b.code ? L('{0}٪ تخفیف · خرید', fa(b.percent)) : (BANNER_CTA[b.action] || 'مشاهده')}</span>` : '';
        const cd = b.code && b._end ? `<i class="bn-cd" data-end="${b._end}"></i>` : '';
        return `<div class="bn-slide th-${esc(b.theme)}"${b.action ? ` onclick="bannerGo(${i})" role="button" tabindex="0"` : ''}><div class="bn-txt"><b>${esc(v.title)}</b>${v.body ? `<span>${esc(v.body)}</span>` : ''}${cd}</div>${cta}</div>`;
      }).join('')}</div>
      ${banners.length > 1 ? `<div class="bn-dots" id="bnDots">${banners.map((b, i) => `<i${i === 0 ? ' class="on"' : ''}></i>`).join('')}</div>` : ''}
    </div>`;
  startBannerCountdown();
  if (banners.length < 2) return;
  const track = document.getElementById('bnTrack'), dots = document.querySelectorAll('#bnDots i');
  const dirn = LANG === 'fa' ? -1 : 1;
  let raf = 0;
  const idx = () => Math.max(0, Math.min(banners.length - 1, Math.round(Math.abs(track.scrollLeft) / track.clientWidth)));
  track.addEventListener('scroll', () => {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; const k = idx(); dots.forEach((d, i) => d.classList.toggle('on', i === k)); });
  }, {passive: true});
  ['pointerdown', 'touchstart'].forEach(ev => track.addEventListener(ev, () => { bannerPause = Date.now() + 9000; }, {passive: true}));
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) return;
  bannerTimer = setInterval(() => {
    const home = document.getElementById('screen-home');
    if (document.hidden || !home || !home.classList.contains('active') || Date.now() < bannerPause) return;
    const next = (idx() + 1) % banners.length;
    track.scrollTo({left: dirn * next * track.clientWidth, behavior: 'smooth'});
  }, 5000);
}

function bannerGo(i){
  const b = banners[i];

  if (b.code){
    // کمپین تخفیف: کد ذخیره میشه و موقع خرید خودکار اعمال میشه

let promo = null, bnCdTimer = null;
function cdTxt(sec){
  sec = Math.max(0, Math.floor(sec));
  if (sec >= 3600) return graceTxt(sec);
  const mm = String(Math.floor(sec / 60)).padStart(2, '0'), ss = String(sec % 60).padStart(2, '0');
  return fa(mm) + ':' + fa(ss);
}
function tickBannerCountdowns(){
  const els = document.querySelectorAll('.bn-cd');
  if (!els.length){ clearInterval(bnCdTimer); bnCdTimer = null; return; }
  let ended = false;
  els.forEach(el => {
    const left = (+el.dataset.end - Date.now()) / 1000;
    if (left <= 0){ ended = true; el.textContent = ''; }
    else el.textContent = cdTxt(left);
  });
  if (ended){ clearInterval(bnCdTimer); bnCdTimer = null; loadBanners(); }   // کمپین تموم شد؛ بنر رو از سرور تازه کن
}
function startBannerCountdown(){
  clearInterval(bnCdTimer); bnCdTimer = null;
  if (!document.querySelector('.bn-cd')) return;
  tickBannerCountdowns();
  bnCdTimer = setInterval(tickBannerCountdowns, 1000);
}

const TAB_ORDER = ['home', 'shop', 'services', 'wallet', 'profile'];
function retrigger(el, cls, ms){
  el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove(cls), ms);
}
function playNav(tab, animate){
  const i = TAB_ORDER.indexOf(tab);
  if (i < 0) return;
  document.querySelector('.nav').style.setProperty('--i', i);
  if (animate){
    const btn = document.querySelector(`.navbtn[data-tab="${tab}"]`);
    if (btn) retrigger(btn, 'hit', 900);
    const ind = document.querySelector('.nav-ind');
    if (ind) retrigger(ind, 'go', 800);
  }
}
function playEnter(tab){
  const el = document.getElementById('screen-' + tab);
  if (el) retrigger(el, 'enter', 1200);
}

function goto(tab){
  const sameTab = (tab === _lastTab);
  _lastTab = tab;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + tab).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelector('.screen.active').scrollTop = 0;
  playNav(tab, !sameTab);
  if (!sameTab) playEnter(tab);

  if (!initData) return;
  if (tab === 'shop' && !loadedTabs.has('shop')){ loadedTabs.add('shop'); loadShop().catch(()=>{}); }
  if ((tab === 'services' || tab === 'home') && !loadedTabs.has('services')){ loadedTabs.add('services'); loadServices().catch(()=>{}); }
  if (tab === 'wallet') loadWallet().catch(()=>{});
  if (tab === 'profile') loadAchievements().catch(()=>{});

function setTheme(t, save){

function themePref(){ const v = lsGet('nd_theme'); return (v === 'light' || v === 'dark') ? v : 'auto'; }
function autoTheme(){
  try{ if (tg && tg.colorScheme) return tg.colorScheme === 'light' ? 'light' : 'dark'; }catch(e){}
  return (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
}
function pageColorFor(t){
  try{
    if (tg && tg.themeParams && tg.colorScheme === t){
      const a = tg.themeParams.bg_color, b = tg.themeParams.secondary_bg_color, ok = h => /^#[0-9a-f]{6}$/i.test(h || '');
      const lum = h => { const c = [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16) / 255); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
      if (ok(a) && ok(b)) return lum(a) <= lum(b) ? a : b;
    }
  }catch(e){}
  return TG_COLORS[t].bg;
}
let _themeSave = true;
function chooseTheme(pref, el){
  const eff = pref === 'auto' ? autoTheme() : pref;

let themeBusy = false;
function toggleTheme(nextArg, originEl){
  if (themeBusy) return;
  const next = (typeof nextArg === 'string') ? nextArg : (curTheme() === 'light' ? 'dark' : 'light');
  if (typeof nextArg !== 'string') _themeSave = next;
  HAP.tap();
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canAnim = !reduce && document.body.animate;
  if (!canAnim){ setTheme(next, _themeSave); return; }
  themeBusy = true;
  const btn = originEl || document.getElementById('themeBtn'), r = btn.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  const W = window.innerWidth, H = window.innerHeight;
  const R = Math.ceil(Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)));
  const veil = document.createElement('div');
  veil.className = 'theme-veil';
  veil.style.cssText = `left:${cx - R}px;top:${cy - R}px;width:${2 * R}px;height:${2 * R}px;background:${pageColorFor(next)}`;
  document.body.appendChild(veil);
  const fin = () => { veil.remove(); themeBusy = false; };
  const grow = veil.animate([{transform: 'scale(0)'}, {transform: 'scale(1)'}], {duration: 340, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards'});
  grow.onfinish = () => {
    setTheme(next, _themeSave);                 // زیر پرده‌ی کاملاً پوشیده، پس لگ دیده نمیشه
    requestAnimationFrame(() => requestAnimationFrame(() => {
      const out = veil.animate([{opacity: 1}, {opacity: 0}], {duration: 240, easing: 'ease-out', fill: 'forwards'});
      out.onfinish = fin;
    }));
  };
  grow.oncancel = fin;
  setTimeout(() => { if (themeBusy && !veil.isConnected) themeBusy = false; }, 2000);
}

    btn._bt = setTimeout(() => { btn.classList.add('busy'); btn.setAttribute('aria-busy', 'true'); }, 100);

const WD_FA = ['ی', 'د', 'س', 'چ', 'پ', 'ج', 'ش'];
function gbStr(b){
  const g = b / 1073741824;
  const x = g >= 100 ? g.toFixed(0) : (g >= 10 ? g.toFixed(1) : g.toFixed(2));
  return dec(fa(String(+x)));
}
function wdLabel(day){
  const dt = new Date(day + 'T12:00:00');
  if (LANG === 'fa') return WD_FA[dt.getDay()];
  try{ return dt.toLocaleDateString(LANG === 'ru' ? 'ru' : 'en', {weekday: 'short'}); }catch(e){ return ''; }
}
function usageChartHTML(u){
  const days = u.days || [];
  const vals = days.map(x => x.bytes);
  const known = vals.filter(v => v !== null);
  const max = Math.max(1, ...known);
  const total = known.reduce((a, b) => a + b, 0);
  const avg = known.length ? total / known.length : 0;
  const maxIdx = known.length ? vals.indexOf(Math.max(...known)) : -1;
  const bars = days.map((x, i) => {
    const none = x.bytes === null;
    const h = none ? 0 : Math.max(5, Math.round(x.bytes / max * 100));
    const showV = !none && x.bytes > 0 && (i === days.length - 1 || i === maxIdx);
    return `<div class="h2-b${i === days.length - 1 ? ' today' : ''}"><small class="v">${showV ? gbStr(x.bytes) : ''}</small><div class="tr"><i style="height:${h}%"></i></div><small class="d">${wdLabel(x.day)}</small></div>`;
  }).join('');
  const note = !known.length
    ? 'هنوز مصرفی ثبت نشده؛ از امروز شروع به ثبت می‌کنیم.'
    : (known.length < 7 ? 'نمودار از لحظه‌ی فعال‌شدن شروع شده و هر روز کامل‌تر میشه.' : '');
  return `
    <div class="h2-uc">
      <div class="sum">

        <div><small>مجموع ۷ روز</small><b>${gbStr(total)} <em>گیگابایت</em></b></div>
      </div>

      ${note ? `<p class="note" style="margin:10px 0 0">${note}</p>` : ''}

}

function forecastRate(d, u){
  if (u && u.tracked_days >= 2 && u.avg_gb > 0.01) return u.avg_gb;
  const used = svcUsedGb(d);
  const el = d.created_at ? (Date.now() / 1000 - d.created_at) / 86400 : 0;
  if (used !== null && used > 0.05 && el >= 1) return used / el;
  return 0;
}
function forecastHTML(d, u){
  if (d.remaining_gb == null || d.status === 'expired' || d.status === 'depleted') return '';
  const rate = forecastRate(d, u);
  if (rate < 0.01) return '';
  const eta = d.remaining_gb / rate;
  const rt = dec(fa(String(+rate.toFixed(2))));
  const left = d.remaining_days;
  let tone, main, sub = '';
  if (eta < 1){
    tone = 'warn'; main = L('با این مصرف (روزی حدود {0} گیگ) حجمت امروز تموم میشه.', rt);
  } else if (left != null && left > 0 && eta < left){
    tone = 'warn';
    main = L('با این مصرف (روزی حدود {0} گیگ) حجمت حدود {1} روز دیگه تموم میشه.', rt, fa(Math.round(eta)));
    const gap = Math.round(left - eta);
    if (gap >= 1) sub = L('{0} روز زودتر از پایان مدت سرویس.', fa(gap));
  } else if (left != null && left > 0){
    tone = 'ok'; main = L('با این مصرف (روزی حدود {0} گیگ) تا آخر مدت سرویس حجم کافی داری.', rt);
  } else {
    tone = eta < 7 ? 'warn' : 'info';
    main = L('با این مصرف (روزی حدود {0} گیگ) حدود {1} روز دیگه حجم داری.', rt, fa(Math.round(eta)));
  }
  return `<div class="h2-fc ${tone}">${icon('pulse')}<div><b>${main}</b>${sub ? `<small>${sub}</small>` : ''}</div></div>`;
}
async function loadUsage(d){
  let u = null;
  try{ u = await apiGet(`/api/service/${d.sub_id}/usage`); }catch(e){}
  if (!svcDetail || svcDetail.sub_id !== d.sub_id) return;
  const us = document.getElementById('usageSlot'), fc = document.getElementById('fcSlot');
  if (us) us.innerHTML = u ? usageChartHTML(u) : '<div class="empty">نمودار مصرف فعلاً در دسترس نیست.</div>';
  if (fc) fc.innerHTML = forecastHTML(d, u);
}

/* ---- شارژ هوشمند ---- */
document.addEventListener('click', e => {
  const c = e.target.closest('.qchip');
  if (!c) return;
  const input = document.getElementById('topupAmountInput');
  if (!input) return;
  input.value = c.dataset.amt;
  document.querySelectorAll('.qchip').forEach(x => x.classList.toggle('on', x === c));
  HAP.tap();
});

})();

function rcRound(x, px, py, w, h, r){
  x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r);
  x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath();
}
function rcGlow(x, cx, cy, r, col){
  const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = g; x.fillRect(cx - r, cy - r, r * 2, r * 2);

/* بلیط کاغذی با دو بریدگی نیم‌دایره کنار خط پاره‌شدن (هم‌زبان با بلیط‌های خود مینی‌اپ) */
function rcTicketPath(x, px, py, pw, ph, r, dy, n){
  x.beginPath();
  x.moveTo(px + r, py); x.lineTo(px + pw - r, py); x.arcTo(px + pw, py, px + pw, py + r, r);
  x.lineTo(px + pw, dy - n); x.arc(px + pw, dy, n, -Math.PI / 2, Math.PI / 2, true);
  x.lineTo(px + pw, py + ph - r); x.arcTo(px + pw, py + ph, px + pw - r, py + ph, r);
  x.lineTo(px + r, py + ph); x.arcTo(px, py + ph, px, py + ph - r, r);
  x.lineTo(px, dy + n); x.arc(px, dy, n, Math.PI / 2, -Math.PI / 2, true);
  x.lineTo(px, py + r); x.arcTo(px, py, px + r, py, r);
  x.closePath();

function rcFit(x, text, weight, size, maxW, min){
  let s = size;

    x.font = `${weight} ${s}px Vazirmatn, sans-serif`;
    if (x.measureText(text).width <= maxW || s <= (min || 24)) return s;
    s -= 2;
  }
}

let rcBusy = false;
async function refCardAct(a){
  if (!refCardCtx) return;

  if (a === 'story'){ shareCardToStory(); return; }

  const btn = document.querySelector('#cSheet [data-rc="share"]');
  setBusy(btn, true);
  try{
    const send = img => Promise.race([
      apiPost('/api/referral/card', {image: img}),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 25000)),
    ]);
    try{
      await send(refCardCtx.dataUrl);
    }catch(e){
      // سرور قدیمی (فقط PNG قبول می‌کرد): یه بار با PNG امتحان کن
      if (e && e.data && e.data.error === 'bad image' && refCardCtx.cv) await send(refCardCtx.cv.toDataURL('image/png'));
      else throw e;
    }
    HAP.ok();
    setBusy(btn, false); okFlash(btn);
    showToast('کارت تو چت ربات برات فرستاده شد', false, 'quiet');
    const note = document.getElementById('rcNote');
    if (note) note.outerHTML = '<button class="btn" type="button" data-rc="close">رفتن به چت و دیدن کارت</button>';
  }catch(e){
    console.error(e);
    const base = (e && e.data && e.data.error) || 'ارسال کارت ممکن نشد، دوباره امتحان کن';
    const code = e && /^http (\d+)/.test(e.message || '') ? e.message.replace('http ', '') : (e && e.message === 'timeout' ? 'timeout' : '');
    showToast(code && !(e && e.data && e.data.error) ? L('{0} (کد {1})', L(base), code) : base, true);
  }finally{
    rcBusy = false;
    setBusy(btn, false);
  }
}

let netIsDown = false, netProbeTimer = null;

async function netProbe(){

/* ترتیب: ۱) نیازمند توجه (منقضی، حجم تموم‌شده، ≤۳ روز، حجم ≤۲۰٪) ۲) فعال‌ها از کمترین روز ۳) بقیه.
   اگه اولیش «واقعاً فوری» نباشه، سرویسی که کاربر خودش آخرین بار انتخاب کرده اول میاد. */
function heroOrder(list){
  const act = pickActions(list);
  const urgentIds = new Set(act.map(a => a.s.sub_id));
  const rest = list.filter(s => !urgentIds.has(s.sub_id));
  const days = s => (s.remaining_days == null ? 1e9 : s.remaining_days);
  const live = rest.filter(s => ['active', 'warn', 'unlimited'].includes(s.status)).sort((a, b) => days(a) - days(b));
  const other = rest.filter(s => !live.includes(s));
  const order = act.map(a => a.s).concat(live, other);
  const first = act[0];
  if (!(first && nbaUrgent(first))){
    const rid = parseInt(lsGet('nd_hero_id') || '', 10);
    const i = order.findIndex(s => s.sub_id === rid);
    if (i > 0) order.unshift(order.splice(i, 1)[0]);
  }
  return order;
}
function heroHello(s){
  const sub = document.getElementById('helloSub'); if (!sub || !s) return;
  const c = svcCalc(s), nmB = `<bdi dir="ltr">${esc(s.username || s.plan_title || '')}</bdi>`;
  if (c.noDays) sub.innerHTML = L('سرویس {0} بدون تاریخ انقضاست.', nmB);
  else if (s.status === 'expired') sub.innerHTML = L('سرویس {0} منقضی شده.', nmB);
  else if (s.remaining_days <= 0 && typeof s.expires_in === 'number' && s.expires_in >= 3600) sub.innerHTML = L('سرویس {0} {1} ساعت دیگه اعتبار داره.', nmB, fa(Math.floor(s.expires_in / 3600)));
  else if (s.remaining_days <= 0) sub.innerHTML = L('سرویس {0} کمتر از ۲۴ ساعت دیگه اعتبار داره.', nmB);
  else sub.innerHTML = L('سرویس {0} {1} روز دیگه اعتبار داره.', nmB, fa(s.remaining_days));
}
function snapToCard(track, card, smooth){
  const rtl = getComputedStyle(track).direction === 'rtl';
  const tr = track.getBoundingClientRect(), cr = card.getBoundingClientRect();
  const delta = rtl ? (cr.right - tr.right) : (cr.left - tr.left);
  track.scrollTo({left: track.scrollLeft + delta, behavior: smooth ? 'smooth' : 'auto'});
}

  heroList = order;

  }).join('');
  return `<div class="h2-chips" id="heroChips">${chips}</div><div id="heroCard">${svcHeroHTML(order[0], {home: true})}</div>`;
}
function heroGo(i){

function heroManyHTML(first, list){

function bindHeroTrack(order){
  const track = document.getElementById('heroTrack');
  if (!track) return;
  const cards = Array.from(track.children);
  let cur = 0, timer = null;
  const idxNow = () => {
    const first = cards[0].getBoundingClientRect(), tr = track.getBoundingClientRect();
    const rtl = getComputedStyle(track).direction === 'rtl';
    const off = rtl ? (tr.right - cards[0].getBoundingClientRect().right) : (tr.left - first.left);   // مسافت اسکرول‌شده
    const step = cards.length > 1 ? Math.abs(cards[1].getBoundingClientRect().left - first.left) : 1;
    let i = Math.round(Math.max(0, off) / Math.max(1, step));
    const max = track.scrollWidth - track.clientWidth;
    if (max - Math.abs(track.scrollLeft) < 4) i = cards.length - 1;
    return Math.min(cards.length - 1, Math.max(0, i));
  };
  const show = i => {
    document.querySelectorAll('#heroDots i').forEach((d, k) => d.classList.toggle('on', k === i));
    };
  track.addEventListener('scroll', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const i = idxNow();
      if (i === cur) return;
      cur = i; show(i);
      const s = order[i];
      heroHello(s); lsSet('nd_hero_id', String(s.sub_id));
      retrigger(cards[i], 'hpop', 900); HAP.select();
    }, 90);
  }, {passive: true});
  const dots = document.getElementById('heroDots');
  if (dots) dots.addEventListener('click', e => {
    const d = e.target.closest('i[data-i]'); if (!d) return;
    snapToCard(track, cards[+d.dataset.i], true);
  });
}

let heroIssued = false;
function pickFeatured(list){
  const live = list.filter(s => ['active', 'warn', 'unlimited'].includes(s.status));
  const pool = live.length ? live : list;
  return pool.slice().sort((a, b) => {
    const da = a.remaining_days == null ? 1e9 : a.remaining_days;
    const db = b.remaining_days == null ? 1e9 : b.remaining_days;
    return da - db;
  })[0];
}

/* کارت «قدم بعدی»: فقط وقتی یه سرویس به اقدام فوری نیاز داره میاد (منقضی، تموم‌شده، ≤۳ روز، یا حجم ≤۲۰٪) */

/* همه‌ی سرویس‌های نیازمند تمدید، از فوری‌ترین */
function pickActions(list){
  const out = [];
  list.forEach(s => {
    const c = svcCalc(s);
    let level = null;
    if (s.status === 'expired') level = 0;
    else if (s.status === 'depleted') level = 1;
    else if (s.remaining_days !== null && s.remaining_days !== undefined && s.remaining_days >= 0 && s.remaining_days <= 3) level = 2;
    else if (!c.isUnlimited && c.remainPct !== null && c.remainPct <= 20) level = 3;
    if (level === null) return;
    const days = (s.remaining_days === null || s.remaining_days === undefined) ? 1e9 : s.remaining_days;
    out.push({s, c, level, days});
  });
  return out.sort((a, b) => a.level - b.level || a.days - b.days);
}

function nbaUrgent(a){ return a.level <= 1 || (a.level === 2 && a.days <= 1); }

/* ---------- ارقام فارسی/عربیِ باقی‌مونده (متن ثابت، داده‌ی سرور، اسم‌هایی که کاربر نوشته) → لاتین ---------- */
const P2L_TEST = /[۰-۹٠-٩]/, P2L_ALL = /[۰-۹٠-٩]/g;
const p2l = ch => String(ch.charCodeAt(0) >= 0x06F0 ? ch.charCodeAt(0) - 0x06F0 : ch.charCodeAt(0) - 0x0660);
function latinizeText(root){
  if (!root) return;
  if (root.nodeType === 3){
    const par = root.parentNode && root.parentNode.nodeName;
    if (par !== 'TEXTAREA' && par !== 'SCRIPT' && par !== 'STYLE' && P2L_TEST.test(root.nodeValue)) root.nodeValue = root.nodeValue.replace(P2L_ALL, p2l);
    return;
  }
  if (root.nodeType !== 1 || /^(SCRIPT|STYLE|TEXTAREA)$/.test(root.nodeName)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) latinizeText(n);
}
latinizeText(document.body);
new MutationObserver(ms => {
  for (const m of ms){
    if (m.type === 'characterData') latinizeText(m.target);
    else m.addedNodes.forEach(latinizeText);
  }
}).observe(document.body, {childList: true, subtree: true, characterData: true});

  try{
    var _goto = goto;
    goto = function(tab){ root.classList.remove('in-sub'); root.setAttribute('data-tab', tab); var g = document.getElementById('gateTitle'); if (g) g.textContent = TITLES[tab] || ''; var r = _goto.apply(this, arguments); sync(); return r; };
    var _openSub = openSub;
    openSub = function(){ root.classList.add('in-sub'); var r = _openSub.apply(this, arguments); sync(); return r; };
  }catch(e){}

  /* ۴) MainButton و SecondaryButton خود تلگرام برای اقدام اصلی/فرعی (دکمه‌های داخل صفحه فقط وقتی نبود می‌مونن) */
  var st = {main:{el:null,cb:null}, secondary:{el:null,cb:null}};
  function paint(kind){
    var b = kind === 'main' ? tg.MainButton : tg.SecondaryButton, el = st[kind].el; if (!b || !el) return;
    var light = curTheme() === 'light';
    var prm = {text:(el.textContent||'').trim(), is_visible:true, is_active:!el.disabled};
    if (kind === 'main'){ prm.color = '#2573d6'; prm.text_color = '#ffffff'; }
    else { prm.position = 'top'; prm.color = light ? '#e4eaf3' : '#243447'; prm.text_color = light ? '#1f66c4' : '#6db4ff'; }
    try{ b.setParams(prm); }catch(e){}
  }
  function bind(kind, el){
    var b = tg && (kind === 'main' ? tg.MainButton : tg.SecondaryButton); if (!b) return;
    var o = st[kind];
    if (o.el === el){ if (el) paint(kind); return; }
    if (o.cb){ try{ b.offClick(o.cb); }catch(e){} o.cb = null; }
    if (o.el) o.el.classList.remove('is-native');
    o.el = el;
    if (!el){ try{ b.hide(); }catch(e){} return; }
    o.cb = function(){ if (el.disabled || el.classList.contains('busy')) return; el.click(); };
    try{ b.onClick(o.cb); }catch(e){}
    el.classList.add('is-native');
    paint(kind);
  }
  var queued = false;
  function sync(){
    if (!tg || !tg.MainButton || queued) return;
    queued = true;
    requestAnimationFrame(function(){
      queued = false;
      var sub = document.getElementById('screen-sub'), on = sub && sub.classList.contains('active');
      bind('main', on ? sub.querySelector('[data-main]') : null);
      bind('secondary', on ? sub.querySelector('[data-secondary]') : null);
      if (on && sub.querySelector('.h2-ok')) HAP.ok();
    });
  }
  try{
    var box = document.getElementById('subContent');
    if (box && window.MutationObserver) new MutationObserver(sync).observe(box, {childList:true, subtree:true, attributes:true, attributeFilter:['disabled','class']});
  }catch(e){}
})();
</script>
</body>
